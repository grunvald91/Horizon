name: 1. Horizon — собрать новости

on:
  schedule:
    # Время в UTC. 02:19 UTC = 05:19 МСК: к 9:00 очередь точно готова, даже если GitHub опоздает.
    - cron: '19 2 * * *'
    # Резервная попытка, если первый запуск пропущен или не завершился.
    - cron: '49 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/horizon-collect.yml', 'data/config.telegram.json', 'scripts/llm_preflight.py', 'scripts/telegram_post.py']   # перезапуск при смене настроек

concurrency:
  group: horizon-queue        # общий замок с публикацией
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write         # чтобы сохранить очередь в ветку news-queue

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout queue branch
        id: queue
        continue-on-error: true   # при первом запуске ветки ещё нет
        uses: actions/checkout@v6
        with:
          ref: news-queue
          path: queue

      - name: Check whether today's queue already exists
        id: freshness
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          today = datetime.now(timezone(timedelta(hours=3))).date().isoformat()
          try:
              with open("queue/queue.json", encoding="utf-8") as f:
                  queue = json.load(f)
              ready = queue.get("date") == today and isinstance(queue.get("posts"), list)
          except (OSError, ValueError, AttributeError):
              ready = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"ready={str(ready).lower()}\n")
          print(f"Queue for {today} already exists: {ready}")
          PY

      - name: Set up Python
        if: steps.freshness.outputs.ready != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check API key and model
        if: steps.freshness.outputs.ready != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # ключ sk-hub-... с claudehub.fun
          # сменить модель: Settings → Secrets and variables → Actions → Variables → HORIZON_MODEL
          HORIZON_MODEL: ${{ vars.HORIZON_MODEL || 'grok-4.7' }}
        run: python3 scripts/llm_preflight.py

      - name: Install uv
        if: steps.freshness.outputs.ready != 'true'
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        if: steps.freshness.outputs.ready != 'true'
        run: uv sync

      - name: Prepare config
        if: steps.freshness.outputs.ready != 'true'
        run: cp data/config.telegram.json data/config.json

      - name: Run Horizon (сбор и сортировка)
        if: steps.freshness.outputs.ready != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          uv run horizon --hours 24 -l INFO 2>&1 | tee /tmp/horizon.log

      - name: Build today's queue
        if: steps.freshness.outputs.ready != 'true'
        env:
          DIGEST_LANG: ru
          POST_MODE: items
          SEND_OVERVIEW: "0"      # 1 = первым постом в 9:00 выйдет список заголовков дня
        run: |
          if [ "${{ steps.queue.outcome }}" != "success" ]; then
            rm -rf queue && mkdir queue && git -C queue init -q -b news-queue
          fi
          python3 scripts/telegram_post.py build-queue queue/queue.json
          # для диагностики: последний дайджест и хвост лога
          cp "$(ls data/summaries/*-ru.md | tail -1)" queue/last-summary.md || true
          tail -n 400 /tmp/horizon.log > queue/last-run.log || true

      - name: Save queue
        if: steps.freshness.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd queue
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Очередь новостей $(date -u +%F)"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:news-queue

      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-collection-failure
          path: /tmp/horizon.log
          if-no-files-found: ignore
          retention-days: 7
